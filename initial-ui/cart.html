<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | CampusBite</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">
                Campus<span>Bite</span>
            </a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="index.html#how-it-works">
                    How it works
                </a>
                <a href="admin.html">Admin</a>
            </div>

            <a href="cart.html" class="cart-button">
                Cart (2)
            </a>

            <button class="login-button">
                Sign in
            </button>

        </nav>
    </header>


    <main>

        <section class="cart-page">

            <div class="section-heading">

                <div>

                    <span class="eyebrow">
                        YOUR ORDER
                    </span>

                    <h2>
                        Shopping cart
                    </h2>

                </div>

                <p>
                    Review your meals before placing
                    your order.
                </p>

            </div>


            <!-- Cart Item 1 -->
            <div class="cart-item">

                <div>
                    <h3>
                        Chicken Burger
                    </h3>

                    <p>
                        1 × €7.90
                    </p>

                </div>

                <strong>
                    €7.90
                </strong>

            </div>


            <!-- Cart Item 2 -->
            <div class="cart-item">

                <div>
                    <h3>
                        Fresh Salad
                    </h3>

                    <p>
                        1 × €6.90
                    </p>

                </div>

                <strong>
                    €6.90
                </strong>

            </div>


            <!-- Total -->
            <div class="cart-total">

                <span>
                    Total
                </span>

                <span>
                    €14.80
                </span>

            </div>


            <!-- Checkout -->
            <div class="form-actions">

                <a href="menu.html" class="secondary-button">
                    ← Continue shopping
                </a>

                <button class="primary-button">
                    Place order
                </button>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <a href="index.html" class="logo footer-logo">
            Campus<span>Bite</span>
        </a>

        <p>
            Fresh food for busy campus days.
        </p>

        <small>
            © 2026 CampusBite
        </small>

    </footer>

</body>
</html>
